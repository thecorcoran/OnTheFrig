<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Schedule Planner - OnTheFrig</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Controls & Planning Section (Hidden when printing) -->
        <div class="controls no-print">
            <div class="app-header">
                <h2>Schedule Builder</h2>
                <div class="backup-actions">
                    <button type="button" id="exportDataBtn" class="btn-secondary-sm" title="Download a backup file of all children and schedules">📥 Export Backup</button>
                    <label class="btn-secondary-sm btn-file-label" title="Import schedule data from a backup file">
                        📤 Import Backup
                        <input type="file" id="importFileInput" accept=".json" style="display: none;">
                    </label>
                </div>
            </div>

            <!-- 1. Child Selection / Profile Management -->
            <div class="child-management-section">
                <div class="section-header">
                    <label class="section-label">Select Child:</label>
                    <div class="child-actions">
                        <button type="button" id="addChildBtn" class="btn-link">+ Add Child</button>
                        <button type="button" id="renameChildBtn" class="btn-link" title="Rename currently selected child">✏️ Rename</button>
                        <button type="button" id="deleteChildBtn" class="btn-link text-danger" title="Remove currently selected child">🗑️ Delete</button>
                    </div>
                </div>
                <div class="child-tabs" id="childTabsContainer">
                    <!-- Dynamically populated child tabs -->
                </div>
            </div>

            <hr class="divider">

            <!-- 2. Week Navigation & History Controls -->
            <div class="week-navigation-section">
                <div class="week-nav-controls">
                    <button type="button" id="prevWeekBtn" class="btn-nav" title="View previous week">◀ Prev Week</button>
                    
                    <div class="week-picker-wrapper">
                        <label for="weekDate" class="sr-only">Week of:</label>
                        <input type="date" id="weekDate" title="Select any date to jump to that week">
                    </div>

                    <button type="button" id="nextWeekBtn" class="btn-nav" title="View next week">Next Week ▶</button>
                    <button type="button" id="currentWeekBtn" class="btn-nav-outline" title="Jump to current week">Current Week</button>
                </div>

                <div class="week-tools">
                    <button type="button" id="copyPrevWeekBtn" class="btn-tool" title="Copy all tasks from the previous week into this week">📋 Copy Last Week's Schedule</button>
                    <button type="button" id="clearWeekBtn" class="btn-tool btn-tool-danger" title="Clear tasks for this week only">Clear This Week</button>
                </div>
            </div>

            <hr class="divider">

            <!-- 3. Task Creation Form -->
            <div class="task-form">
                <div class="input-grid">
                    <div class="form-group flex-2">
                        <label for="taskName">Task Name:</label>
                        <input type="text" id="taskName" placeholder="e.g., Math Lesson, Piano Practice, Chores" list="taskHistory" autocomplete="off">
                        <datalist id="taskHistory"></datalist>
                    </div>

                    <div class="form-group">
                        <label for="timeOfDay">Time of Day:</label>
                        <select id="timeOfDay">
                            <option value="Morning">Morning</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Afternoon">Afternoon</option>
                            <option value="Nighttime">Nighttime</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label" for="isMustDo">
                            <input type="checkbox" id="isMustDo">
                            <span>Must be done (High Priority)</span>
                        </label>
                    </div>
                </div>

                <!-- Recurring / Multi-Day Selection -->
                <div class="day-selection-section">
                    <label class="section-label">Select Day(s) for this Task:</label>
                    
                    <div class="day-chips" id="dayChipsContainer">
                        <label class="day-chip"><input type="checkbox" name="taskDay" value="Monday"><span>Mon</span></label>
                        <label class="day-chip"><input type="checkbox" name="taskDay" value="Tuesday"><span>Tue</span></label>
                        <label class="day-chip"><input type="checkbox" name="taskDay" value="Wednesday"><span>Wed</span></label>
                        <label class="day-chip"><input type="checkbox" name="taskDay" value="Thursday"><span>Thu</span></label>
                        <label class="day-chip"><input type="checkbox" name="taskDay" value="Friday"><span>Fri</span></label>
                        <label class="day-chip"><input type="checkbox" name="taskDay" value="Saturday"><span>Sat</span></label>
                        <label class="day-chip"><input type="checkbox" name="taskDay" value="Sunday"><span>Sun</span></label>
                    </div>

                    <div class="day-presets">
                        <span class="preset-label">Quick select:</span>
                        <button type="button" class="btn-preset" id="presetWeekdays">Weekdays</button>
                        <button type="button" class="btn-preset" id="presetWeekends">Weekends</button>
                        <button type="button" class="btn-preset" id="presetEveryday">All Days</button>
                        <button type="button" class="btn-preset" id="presetClearDays">Clear</button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="addTaskBtn" class="btn-primary">+ Add Task</button>
                </div>
            </div>
        </div>

        <!-- Printable Schedule Grid -->
        <div id="printableArea">
            <div id="scheduleHeader">
                <h1 id="displayName">Child's Schedule</h1>
                <h2 id="displayDate">Week of...</h2>
            </div>
            <div class="schedule-grid" id="schedule-grid-container">
                <!-- Dynamically populated day columns -->
            </div>
        </div>
        
        <!-- Print Action -->
        <div class="print-action-bar no-print">
            <button id="printBtn" class="btn-print">🖨️ Print Schedule</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
